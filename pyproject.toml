[project]
name = "komikan"
version = "0.1.0"
description = "The Mapuche board game Komikan: Gymnasium environment, RL agents and web version"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=1.0"]

[project.optional-dependencies]
train = ["sb3-contrib>=2.3", "torch>=2.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "quickjs>=1.19.4",
]

[project.scripts]
komikan-train = "komikan.train:main"
komikan-eval = "komikan.evaluate:main"
komikan-export-web = "komikan.export_web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/komikan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
